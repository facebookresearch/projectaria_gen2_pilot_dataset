name: Build wheels and deploy

on:
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Where to deploy the artifacts? Only build (build), deploy to test PyPI (test), deploy to PyPI (prod)'
        required: true
        type: choice
        default: 'build'
        options:
          - build
          - test
          - prod
  pull_request:
  schedule:
    # Weekly canary, Monday 16:00 UTC = 8 AM PST / 9 AM PDT.
    #
    # We cannot explicitly set `deploy: build` here -- GitHub Actions does not
    # allow `inputs:` on `schedule:` triggers (only on `workflow_dispatch:`).
    # On a schedule or pull_request trigger, github.event.inputs.deploy is null,
    # so the publish-to-pypi job is skipped automatically. Net effect: those
    # runs build and test the distributions -- they cannot publish to PyPI.
    - cron: '0 16 * * MON'

jobs:
  build-distributions:
    name: Build sdist and wheel
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Upgrade pip and install build tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine
      # Passing both --sdist and --wheel builds each from the source tree.
      # Bare `python -m build` would instead build the wheel from the sdist,
      # which is fragile here because setup.py maps the package root to ".".
      - name: Build sdist and wheel
        run: python -m build --sdist --wheel --outdir dist
      - name: Check distribution metadata
        run: twine check dist/*
      # Installs without --no-deps on purpose: this resolves the full dependency
      # set from PyPI, so the run fails loudly if a pin is unpublished or
      # unsatisfiable on this Python. Requires projectaria-tools>=2.2.0 to be
      # released on PyPI.
      - name: Install the wheel and smoke test
        run: |
          python -m pip install dist/*.whl
          python -c "from aria_gen2_pilot_dataset import AriaGen2PilotDataProvider; print(AriaGen2PilotDataProvider)"
          aria_gen2_pilot_dataset_viewer --help
      - uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist

  publish-to-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs:
      - build-distributions
    if: github.event_name == 'workflow_dispatch' && (github.event.inputs.deploy == 'test' || github.event.inputs.deploy == 'prod')
    steps:
      - name: Download distributions from the build job
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          # PyPI publish action uploads everything under dist/* by default
          path: dist

      - name: Display the list of artifacts
        run: ls -R dist

      - name: Publish to Test PyPI
        if: github.event.inputs.deploy == 'test'
        uses: pypa/gh-action-pypi-publish@v1.13.0
        with:
          user: __token__
          password: ${{ secrets.TEST_PYPI_TOKEN_PROJECTARIA_GEN2_PILOT_DATASET }}
          repository_url: https://test.pypi.org/legacy/
          skip_existing: true
          verbose: true
      - name: Publish to PyPI
        if: github.event.inputs.deploy == 'prod'
        uses: pypa/gh-action-pypi-publish@v1.13.0
        with:
          user: __token__
          password: ${{ secrets.PYPI_TOKEN_PROJECTARIA_GEN2_PILOT_DATASET }}
          skip_existing: true
          verbose: true
